  function practicePrompt(D, N) {
    const { kind, activity, part, whole, other, moved, moves, wrong, done, picture, sketch } = practice;
    const P = D.practice, lesson = P[activity], animal = P[kind].animal;
    if (done) {
      if (kind === "compare") {
        const { left, right, sign } = practiceComparison();
        return `${N(left)} ${D.symWord[sign]} ${N(right)}`;
      }
      return lesson.done(N(part), N(whole), N(other));
    }
    if (!picture) {
      if (wrong !== null) return P.imagineAgain;
      return sketch ? P.drawing[activity](N(part), N(whole), N(other)) : lesson.imagine(N(part), N(whole), N(other), animal);
    }
    if (wrong !== null) return lesson.again;
    if (moved.size === moves) return lesson.ask;
    return lesson.step(N(part), N(whole), N(other), animal);
  }

  function renderPracticeNotation() {
    const { activity, part, whole, other, answer, diagram, done } = practice;
    $("#practiceBond").hidden = !diagram;
    $("#practiceEquation").hidden = !!diagram || (done && activity !== "compare");
    if (diagram) {
      const P = T().practice;
      const values = [diagram === "whole" && !done ? "?" : fmt(whole), fmt(part), diagram === "part" && !done ? "?" : fmt(other)];
      ["#practiceBondWhole", "#practiceBondPart", "#practiceBondOther"].forEach((id, i) => {
        const node = $(id);
        node.textContent = values[i];
        node.classList.toggle("blank", values[i] === "?");
      });
      label("#practiceBond", P.diagram(...values.map((v) => v === "?" ? P.blank : v)));
      return;
    }
    let terms;
    if (activity === "compare") {
      const { left, right, sign } = practiceComparison();
      terms = [left, done ? sign : "?", right];
    } else {
      const box = done ? answer : "?";
      terms = {
        add: [part, "+", other, "=", box],
        sub: [whole, "−", part, "=", box],
        fill: [part, "+", box, "=", whole],
      }[activity];
    }
    $("#practiceEquation").replaceChildren(...terms.map((term) => {
      const span = el("span", term === "?" ? "blank" : "");
      span.textContent = fmt(term);
      return span;
    }));
  }

  function renderPracticeTray() {
    const { kind, activity, part, other, moved, moves } = practice;
    const P = T().practice, lesson = P[activity], adding = activity !== "sub";
    $("#practiceCount").textContent = lesson.count(fmt(activity === "fill" ? part + moved.size : moved.size), fmt(part), fmt(other));
    [...$("#practiceTray").children].forEach((cell, i) => {
      const changed = moved.has(i);
      const empty = adding && i >= part && !changed;
      const removed = !adding && changed;
      cell.disabled = moved.size === moves || (adding ? !empty : removed);
      cell.classList.toggle("empty", empty);
      cell.classList.toggle("added", adding && changed);
      cell.classList.toggle("removed", removed);
      if (empty || removed) cell.textContent = empty ? "+" : "×";
      else if (!cell.firstElementChild) cell.replaceChildren(practiceArt(kind));
      const name = empty ? P.put : removed ? P.removed : changed ? P.added : adding || cell.disabled ? P.original : P.take;
      cell.setAttribute("aria-label", `${name} ${fmt(i + 1)}`);
    });
  }

  function renderPracticeQuestion() {
    const { kind, activity, moved, moves, wrong, done, picture, sketch, showMethod } = practice;
    const P = T().practice, lesson = P[activity];
    const compare = kind === "compare", ready = picture ? moved.size === moves : !sketch || sketch.ready;
    const prompt = practicePrompt(T(), fmt);
    if ($("#practicePrompt").textContent !== prompt) $("#practicePrompt").textContent = prompt;
    $("#practiceTray").hidden = !picture || compare || done;
    $("#practiceCount").hidden = !picture || compare || done;
    $("#practiceDrawing").hidden = !sketch || picture || done;
    if (!$("#practiceDrawing").hidden) {
      $("#practiceCanvas").hidden = sketch.paper;
      $("#practiceSketchTools").hidden = sketch.paper;
      $("#practiceDrawPaper").textContent = sketch.paper ? P.drawing.screen : P.drawing.paper;
      $("#practiceDrawContinue").hidden = sketch.ready;
    }
    $("#practiceCompare").hidden = !compare || !(done ? showMethod : picture);
    if (picture && !compare && !done) renderPracticeTray();
    if (!done) $("#practiceGuide").textContent = picture ? ready ? lesson.during : lesson.before : sketch ? P.drawing.guide : lesson.think;
    if (done && compare) $("#practiceGuide").textContent = lesson.after;
    $("#practiceChoices").hidden = !ready || done;
    $("#practicePicture").hidden = picture || done || !ready;
    $("#practiceOutcome").hidden = !done;
    $("#practiceStop").hidden = practice.index + 1 === practice.questions.length;
    $("#practiceSwap").hidden = !compare;
    $("#practiceExplain").textContent = showMethod ? P.hideExplain : P.explain;
    $("#practiceExplain").setAttribute("aria-expanded", String(showMethod));
    $("#practiceGuideBox").hidden = done && !showMethod;
    $("#practiceModel").hidden = !done || compare || !showMethod;
    $$("#practiceChoices button").forEach((b) => b.toggleAttribute("data-wrong", b.value === String(wrong)));
  }

  function renderPracticeModel() {
    const { part, whole, other, split } = practice;
    const M = T().practice.model;
    const first = fmt(part), second = fmt(other), total = fmt(whole);
    $("#practiceModelStars").toggleAttribute("data-split", split);
    $("#practiceModelPartLabel").textContent = split ? M.taken(first) : M.first(first);
    $("#practiceModelOtherLabel").textContent = split ? M.left(second) : M.second(second);
    $("#practiceModelEquation").textContent = split ? `${total} − ${first} = ${second}` : `${first} + ${second} = ${total}`;
    $("#practiceModelToggle").textContent = split ? M.join : M.split(first);
    $("#practiceGuide").textContent = split ? M.restore : M.predict;
  }

  function comparisonSign(left, right) {
    if (left === right) return "=";
    return left > right ? ">" : "<";
  }

  function practiceComparison() {
    const { part, whole, swapped } = practice;
    const [left, right] = swapped ? [whole, part] : [part, whole];
    return { left, right, sign: comparisonSign(left, right), swapped };
  }

  function renderPracticeComparison() {
    const { left, right, swapped } = practiceComparison();
    const lesson = T().practice.compare;
    const paired = Math.min(left, right), slots = Math.max(left, right);
    const leftGroup = $("#practiceCompareLeft"), rightGroup = $("#practiceCompareRight");
    leftGroup.toggleAttribute("data-second", swapped);
    rightGroup.toggleAttribute("data-second", !swapped);
    $("strong", leftGroup).textContent = lesson.left(fmt(left));
    $("strong", rightGroup).textContent = lesson.right(fmt(right));
    [[leftGroup, left], [rightGroup, right]].forEach(([group, count]) => {
      $(".practice-compare-stars", group).replaceChildren(...range(slots).map((i) => {
        const empty = i >= count;
        const slot = el("span", empty ? "empty" : i >= paired ? "extra" : "");
        if (!empty) slot.append(practiceArt("compare"));
        return slot;
      }));
    });
  }

  function buildPracticePicture() {
    const { kind, activity, part, whole, other, moves } = practice;
    const tray = $("#practiceTray");
    if (kind === "compare") {
      renderPracticeComparison();
      return;
    }
    $("#practiceModelStars").style.gridTemplateColumns = `${part}fr ${other}fr`;
    $("#practiceModelPart").replaceChildren(...range(part).map(() => practiceArt(kind)));
    $("#practiceModelOther").replaceChildren(...range(other).map(() => practiceArt(kind)));
    tray.replaceChildren(...range(whole).map((i) => {
      const cell = el("button", "practice-cell");
      cell.type = "button";
      cell.addEventListener("click", (e) => {
        practice.moved.add(i);
        renderPracticeQuestion();
        if (voiceLang()) say((D, N) => N(activity === "fill" ? part + practice.moved.size : practice.moved.size), 1);
        const ready = practice.moved.size === moves, options = $("#practiceChoices");
        if (e.detail === 0) (ready ? options.firstElementChild : $("button:enabled", tray)).focus();
        else if (ready) options.scrollIntoView({ block: "nearest" });
      });
      return cell;
    }));
  }

  function awardPracticeGrowth(kind) {
    const previous = practiceStage(kind);
    const max = PRACTICE_GROWTH[PRACTICE_GROWTH.length - 1];
    if (S.practice[kind] >= max) return;
    S.practice[kind]++;
    save();
    if (practiceStage(kind) === previous) return;
    const panel = $("#practiceGrowth");
    renderPracticeCompanion(panel, kind, true);
    panel.hidden = false;
  }

  function answerPractice(value, fromKeyboard) {
    if (practice.done) return;
    const { kind, answer, picture, wrong, step } = practice;
    practice.done = value === answer;
    practice.wrong = practice.done ? null : value;
    renderPracticeQuestion();
    if (!practice.done) return;
    hush();
    renderPracticeNotation();
    if (kind !== "compare") renderPracticeModel();
    if (step === "think" && !picture && wrong === null) awardPracticeGrowth(kind);
    sfx.good();
    if (fromKeyboard) $("#practiceNext").focus();
    else $("#practiceOutcome").scrollIntoView({ block: "nearest" });
  }

  function startPractice(kind) {
    const rounds = PRACTICE_ROUNDS[kind], short = practiceRound === "short";
    const questions = (short ? SHORT_PRACTICE : range(rounds.length)).map((source, index) => {
      const [part, whole] = pick(rounds[source]);
      const diagram = kind === "fill" ? PRACTICE_DIAGRAMS[source] : null;
      const step = short && index === 1 ? "draw" : source < GUIDED_QUESTIONS ? "objects" : "think";
      return { part, whole, diagram, step };
    });
    showPracticeQuestion({ kind, questions }, 0);
  }

  function showPracticeQuestion({ kind, questions }, index) {
    hush();
    const { part, whole, diagram, step } = questions[index], compare = kind === "compare";
    const activity = diagram === "whole" ? "add" : kind;
    const other = compare ? 0 : whole - part;
    const answer = compare ? comparisonSign(part, whole) : activity === "add" ? whole : other;
    const moves = compare ? 0 : activity === "sub" ? part : other;
    const picture = step === "objects";
    if (step === "draw" && sketchContext === undefined) sketchContext = sketchCanvas.getContext("2d");
    const sketch = step === "draw" ? { strokes: [], paper: !sketchContext, ready: false } : null;
    practice = {
      kind, activity, diagram, questions, index, step, part, whole, other, answer, moves, picture, sketch,
      moved: new Set(), wrong: null, done: false, showMethod: false, split: activity === "sub", swapped: false,
    };
    const D = T(), P = D.practice;
    $("#practiceLessonTitle").textContent = P[kind].title;
    $("#practiceProgress").textContent = P.progress(fmt(index + 1), fmt(questions.length));
    $("#practiceNext").textContent = index + 1 === questions.length ? P.finish : P.next;
    $("#practiceSpeak").hidden = !S.voice || !voiceLang();
    $("#practiceGrowth").hidden = true;
    label("#practiceBack", P.choose);
    sketchStroke = null;
    if (sketch) {
      practiceArt(kind, practiceStage(kind), $("#practiceDrawArt"));
      sketchCanvas.toggleAttribute("data-sides", compare);
      $("#practiceDrawPaper").hidden = !sketchContext;
      selectPracticeInk($("#practiceInkBlue"));
      $("#practiceDrawUndo").disabled = true;
    }
    renderPracticeNotation();
    buildPracticePicture();
    const expectedParts = picture && activity !== "add" && part !== other;
    const values = compare ? ["<", "=", ">"] : expectedParts ? [part, other, whole].sort((a, b) => a - b) : choicesFor(answer, 0, 10);
    $("#practiceChoices").replaceChildren(...values.map((value) => {
      const b = el("button", "btn num");
      b.type = "button";
      b.value = value;
      b.textContent = fmt(value);
      b.addEventListener("click", (e) => answerPractice(value, e.detail === 0));
      return b;
    }));
    renderPracticeQuestion();
    $("#practiceMenu").hidden = true;
    $("#practiceSummary").hidden = true;
    $("#practiceQuestion").hidden = false;
    $("#practice").scrollTop = 0;
    $("#practiceLessonTitle").focus({ preventScroll: true });
    if (sketch) resizePracticeSketch();
  }

  function showPracticeSummary() {
    const { kind, index, questions } = practice;
    const P = T().practice, completed = fmt(index + 1);
    hush();
    $("#practiceSummaryTitle").textContent = index + 1 === questions.length ? P.summary(completed) : P.stopped(completed);
    $("#practiceSummaryNote").textContent = digitsIn(P[kind].home);
    renderPracticeCompanion($("#practiceSummaryCompanion"), kind, false);
    $("#practiceQuestion").hidden = true;
    $("#practiceSummary").hidden = false;
    $("#practice").scrollTop = 0;
    $("#practiceSummaryTitle").focus({ preventScroll: true });
  }

  /* Sketch coordinates are fractions of the canvas so turning the phone
     preserves the drawing. The drawing is temporary and never graded. */
  const sketchCanvas = $("#practiceCanvas");
  let sketchContext;
  let sketchStroke = null;

  function selectPracticeInk(button) {
    $$("#practiceSketchTools [data-ink]").forEach((node) => node.setAttribute("aria-pressed", String(node === button)));
  }

  function sketchPoint(e) {
    const box = sketchCanvas.getBoundingClientRect();
    return {
      x: clamp((e.clientX - box.left) / box.width, 0, 1),
      y: clamp((e.clientY - box.top) / box.height, 0, 1),
    };
  }

  function paintSketchLine(from, to, color) {
    const width = sketchCanvas.width, height = sketchCanvas.height, pen = sketchContext;
    const size = 3.5 * Math.min(2, window.devicePixelRatio || 1);
    pen.beginPath();
    if (!from) {
      pen.fillStyle = color;
      pen.arc(to.x * width, to.y * height, size / 2, 0, 2 * Math.PI);
      pen.fill();
      return;
    }
    pen.lineWidth = size;
    pen.lineCap = "round";
    pen.strokeStyle = color;
    pen.moveTo(from.x * width, from.y * height);
    pen.lineTo(to.x * width, to.y * height);
    pen.stroke();
  }

  function resizePracticeSketch() {
    if (!practice?.sketch || !sketchContext || $("#practiceDrawing").hidden || sketchCanvas.hidden) return;
    const box = sketchCanvas.getBoundingClientRect(), scale = Math.min(2, window.devicePixelRatio || 1);
    if (!box.width || !box.height) return;
    sketchCanvas.width = Math.round(box.width * scale);
    sketchCanvas.height = Math.round(box.height * scale);
    practice.sketch.strokes.forEach(({ color, points }) => points.forEach((point, i) => paintSketchLine(points[i - 1], point, color)));
  }

  sketchCanvas.addEventListener("pointerdown", (e) => {
    if (!practice?.sketch || sketchStroke || !e.isPrimary || e.button !== 0) return;
    const color = $("#practiceSketchTools [aria-pressed='true']").dataset.ink;
    const point = sketchPoint(e);
    sketchStroke = { pointer: e.pointerId, color, points: [point] };
    practice.sketch.strokes.push(sketchStroke);
    sketchCanvas.setPointerCapture(e.pointerId);
    paintSketchLine(null, point, color);
    $("#practiceDrawUndo").disabled = false;
  });
  sketchCanvas.addEventListener("pointermove", (e) => {
    if (!sketchStroke || sketchStroke.pointer !== e.pointerId) return;
    const { points, color } = sketchStroke;
    const point = sketchPoint(e);
    paintSketchLine(points[points.length - 1], point, color);
    points.push(point);
  });
  function stopPracticeSketch(e) {
    if (sketchStroke?.pointer === e.pointerId) sketchStroke = null;
  }
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((name) => sketchCanvas.addEventListener(name, stopPracticeSketch));
  window.addEventListener("resize", resizePracticeSketch);

  function onPracticeSketchAction(button, action) {
    let start = null;
    button.addEventListener("click", action);
    button.addEventListener("touchstart", (e) => {
      start = e.touches.length === 1 ? e.changedTouches[0] : null;
    }, { passive: true });
    button.addEventListener("touchcancel", () => { start = null; });
    // Mobile Chrome can suppress the synthetic click immediately after a drawn stroke.
    button.addEventListener("touchend", (e) => {
      const first = start, last = e.changedTouches[0];
      start = null;
      if (!first || !last || first.identifier !== last.identifier || e.touches.length || button.disabled) return;
      if (Math.hypot(first.clientX - last.clientX, first.clientY - last.clientY) > 12 ||
          !button.contains(document.elementFromPoint(last.clientX, last.clientY))) return;
      e.preventDefault();
      action(e);
    }, { passive: false });
  }

  function openPractice() {
    token++;  // a tap can switch modes while the city is waiting for fonts
    musicStop();
    setScreen("practice");
    showPracticeMenu();
  }
  $("#practiceBtn").addEventListener("click", openPractice);
  $$("#practiceRounds [data-round]").forEach((button) => button.addEventListener("click", () => {
    practiceRound = button.dataset.round;
    $$("#practiceRounds [data-round]").forEach((node) => node.setAttribute("aria-pressed", String(node === button)));
  }));
  $$("#practiceMenu [data-lesson]").forEach((b) => b.addEventListener("click", () => startPractice(b.dataset.lesson)));
  $("#practiceBack").addEventListener("click", practiceBack);
  $("#practiceChoose").addEventListener("click", showPracticeMenu);
  $("#practiceRepeat").addEventListener("click", () => startPractice(practice.kind));
  $("#practiceSpeak").addEventListener("click", () => { primeVoice(); say(practicePrompt); });
  $$("#practiceSketchTools [data-ink]").forEach((button) => onPracticeSketchAction(button, () => selectPracticeInk(button)));
  onPracticeSketchAction($("#practiceDrawUndo"), () => {
    const { strokes } = practice.sketch;
    sketchStroke = null;
    strokes.pop();
    $("#practiceDrawUndo").disabled = strokes.length === 0;
    resizePracticeSketch();
  });
  onPracticeSketchAction($("#practiceDrawPaper"), () => {
    sketchStroke = null;
    practice.sketch.paper = !practice.sketch.paper;
    renderPracticeQuestion();
    resizePracticeSketch();
  });
  onPracticeSketchAction($("#practiceDrawContinue"), (e) => {
    const sketch = practice.sketch;
    if (sketch.paper || sketch.strokes.length) sketch.ready = true;
    else practice.sketch = null;
    renderPracticeQuestion();
    if (e.type === "click" && e.detail === 0) $("#practiceChoices button").focus();
    else $("#practiceChoices").scrollIntoView({ block: "nearest" });
  });
  $("#practicePicture").addEventListener("click", (e) => {
    hush();
    sketchStroke = null;
    practice.picture = true;
    practice.wrong = null;
    renderPracticeQuestion();
    if (e.detail === 0) $(practice.kind === "compare" ? "#practiceChoices button" : "#practiceTray button:enabled").focus();
  });
  $("#practiceModelToggle").addEventListener("click", () => {
    practice.split = !practice.split;
    renderPracticeModel();
  });
  $("#practiceExplain").addEventListener("click", () => {
    practice.showMethod = !practice.showMethod;
    renderPracticeQuestion();
  });
  $("#practiceSwap").addEventListener("click", () => {
    practice.swapped = !practice.swapped;
    practice.showMethod = true;
    renderPracticeNotation();
    renderPracticeComparison();
    renderPracticeQuestion();
  });
  $("#practiceStop").addEventListener("click", showPracticeSummary);
  $("#practiceNext").addEventListener("click", () => {
    const { index, questions } = practice;
    if (index + 1 < questions.length) showPracticeQuestion(practice, index + 1);
    else showPracticeSummary();
  });

  /* =====================================================================
     Buttons, keys and the first tap
     ===================================================================== */
  $("#prevMon").addEventListener("click", () => { ctx(); sfx.pop(); showMonster(home.index - 1); });
  $("#nextMon").addEventListener("click", () => { ctx(); sfx.pop(); showMonster(home.index + 1); });
  $("#buyBtn").addEventListener("click", buyMonster);
  $("#playBtn").addEventListener("click", () => {
    ctx();
    primeVoice();
    if (!renderer) return;
    if (!cityOpen(home.city)) home.city = defaultCity();
    sfx.pop();
    startCity(home.city);
  });
  $("#gBack").addEventListener("click", () => { ctx(); goHome(); });
  $("#qBear").addEventListener("click", () => {
    ctx();
    if (Q && !busy) sayAsk();
    else if (G && G.stunT > 0) say((D) => D.stunned);
  });
  ["#musicHome", "#musicGame"].forEach((id) => $(id).addEventListener("click", () => setMusic(!S.music)));
  $("#cutSkip").addEventListener("click", skipCut);
  $("#winNext").addEventListener("click", () => { ctx(); primeVoice(); if (winActs.next) winActs.next(); });
  $("#winHome").addEventListener("click", () => { ctx(); if (winActs.home) winActs.home(); });
  $("#retry").addEventListener("click", () => location.reload());

  let superToldAt = 0;
  function superPress() {
    if (!G) return;
    if (G.phase === "cut") { nextLine(); return; }
    if (G.charge >= 3) { doSuper(); return; }
    sfx.boing();
    if (performance.now() - superToldAt > 3000) { superToldAt = performance.now(); toast(T().superHow); }
  }
  /* the punch button keeps punching while held, like a real game pad */
  let holdTimer = 0;
  const stopHold = () => { clearInterval(holdTimer); holdTimer = 0; };
  const punchBtn = $("#btnAttack"), superBtn = $("#btnSuper");
  punchBtn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    ctx();
    attackPress();
    stopHold();
    holdTimer = setInterval(() => { if (G && G.on) attack(null); else stopHold(); }, 380);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => punchBtn.addEventListener(ev, stopHold));
  punchBtn.addEventListener("click", (e) => { if (e.detail === 0) attackPress(); });
  superBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); ctx(); superPress(); });
  superBtn.addEventListener("click", (e) => { if (e.detail === 0) superPress(); });
  [punchBtn, superBtn].forEach((b) => b.addEventListener("contextmenu", (e) => e.preventDefault()));

  const MOVE_KEYS = new Set(["arrowleft", "arrowright", "arrowup", "arrowdown", "a", "d", "w", "s"]);
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      if (!$("#parentWrap").hidden) { closeParent(); return; }
      if (current === "practice") { practiceBack(); return; }
      if (G && G.phase === "cut") skipCut();
      return;
    }
    if (current !== "game" || !G || !$("#parentWrap").hidden || !$("#win").hidden) return;
    const tag = e.target && e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    const k = e.key.toLowerCase();
    if (MOVE_KEYS.has(k)) { input.keys.add(k); e.preventDefault(); return; }
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if ((k === " " || k === "enter") && tag === "BUTTON") return;   // the focused button handles it
    if (k === " " || k === "j") { e.preventDefault(); attackPress(); return; }
    if (k === "k") { superPress(); return; }
    if (k === "1" || k === "2" || k === "3") chooseByIndex(Number(k) - 1);
  });
  window.addEventListener("keyup", (e) => input.keys.delete(e.key.toLowerCase()));
  window.addEventListener("blur", () => { input.keys.clear(); stopHold(); });
  document.addEventListener("visibilitychange", () => { if (document.hidden) { hush(); input.keys.clear(); stopHold(); } });
  window.addEventListener("resize", resize);
  if (window.visualViewport) visualViewport.addEventListener("resize", resize);

  /* =====================================================================
     Start
     ===================================================================== */
  let loading3D = false;

  function showGameUnavailable() {
    $("#playBtn").disabled = true;
    $("#no3d").hidden = false;
    renderPlay();
  }

  function startGame3D() {
    try {
      if (!init3D()) { showGameUnavailable(); return; }
      buildHome();
      resize();
      showMonster(Math.max(0, MONSTERS.findIndex((m) => m.id === S.game.monster)));
    } catch (e) {
      if (renderer) renderer.dispose();
      renderer = home.scene = home.monster = null;
      console.warn("Could not start the 3D game", e);
      showGameUnavailable();
      return;
    }
    renderer.domElement.addEventListener("webglcontextlost", (e) => { e.preventDefault(); showGameUnavailable(); });
    renderer.domElement.addEventListener("webglcontextrestored", () => {
      $("#no3d").hidden = true;
      $("#playBtn").disabled = false;
      renderPlay();
    });
    $("#no3d").hidden = true;
    $("#playBtn").disabled = false;
    $(".monster-row").hidden = false;
    $("#cities").hidden = false;
    renderHome();
    requestAnimationFrame(loop);
  }

  function loadGame3D() {
    if (renderer || loading3D || !$("#no3d").hidden) return;
    if (window.THREE) { startGame3D(); return; }
    loading3D = true;
    renderPlay();
    const script = document.createElement("script");
    script.src = "three.min.js";
    script.onload = () => {
      loading3D = false;
      if (current === "home") startGame3D();
    };
    script.onerror = () => {
      loading3D = false;
      script.remove();
      showGameUnavailable();
    };
    document.head.append(script);
  }

  home.city = defaultCity();
  applyLang();
  if (synth) {
    findVoices();
    try { synth.addEventListener("voiceschanged", findVoices); } catch (e) { synth.onvoiceschanged = findVoices; }
    setTimeout(findVoices, 900);
  }
  if (new URLSearchParams(location.search).get("mode") === "practice") openPractice();
  else loadGame3D();
  // browsers only allow sound after the first tap, so the home song starts then
  window.addEventListener("pointerdown", () => { ctx(); if (current === "home" && S.music && !music.name) musicPlay("home"); }, true);
})();
</script>

<script>
/* keep the game on the phone so it opens without the internet; ask the browser not to clear progress */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
if (window.matchMedia && matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches && navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
</script>
</body>
