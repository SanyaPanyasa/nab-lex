<!doctype html>
<html lang="lo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F8BE0">
<meta name="description" content="ເກມເລກ 3D ສຳລັບເດັກນ້ອຍ · เกมเลข 3D สำหรับเด็ก">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ນັບເລກ">
<title>ນັບເລກກັບໝີນ້ອຍ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mali:wght@400;600;700&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap">
<style>
/* Layout: a full-screen 3D city (WebGL canvas) under thin HUD layers. Home shows the chosen monster on a
   stage with toy buttons below; play keeps the question card on top and the joystick and punch buttons
   at the bottom, so the fight happens in the band between them. */
:root {
  --sky-bg: #BFE8FF;
  --card: #FFFFFF; --ink: #1D2742; --ink-soft: #56617B; --line: #D2DCEA; --dim: #E6ECF5; --star-off: #D8DFEA;
  --scrim: rgba(16, 24, 44, 0.55);
  --sun: #F5A900; --sun-soft: #FFF0C6; --on-sun: #1D2742;
  --sky: #2B85DA; --sky-soft: #DCEBFC;
  --leaf: #1E9C5D; --leaf-soft: #D7F2E4;
  --tomato: #E64F3A; --tomato-soft: #FFE0D8;
  --grape: #8056E5; --grape-soft: #EBE2FF;
  --berry: #CF3F74; --berry-soft: #FCE0EB;
  --good: #178A52; --on-good: #FFFFFF;
  --cta: #F26B00; --cta-deep: #B54F00; --on-cta: #FFFFFF;
  --punch: #E64F3A; --punch-deep: #A8301F;
  --badge: #1D2742; --on-badge: #FFFFFF; --focus: #2B85DA;
  --font-text: "Noto Sans Lao", "Phetsarath OT", "Saysettha OT", "Lao UI", system-ui, sans-serif;
  --font-num: "Fredoka", "Noto Sans Lao", "Mali", system-ui, sans-serif;
  --font-emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --cell: clamp(22px, 6.6vw, 34px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky-bg: #16203A; --card: #1B2338; --ink: #EEF2FB; --ink-soft: #A9B2C8; --line: #2D3852; --dim: #2A3450; --star-off: #36405A;
    --scrim: rgba(0, 0, 0, 0.62);
    --sun: #FFC23D; --sun-soft: #3A3014; --sky: #5FAEF6; --sky-soft: #15304D;
    --leaf: #3BCB84; --leaf-soft: #12382A; --tomato: #FF7A64; --tomato-soft: #40211B;
    --grape: #A88AFF; --grape-soft: #2B2348; --berry: #FF7AA8; --berry-soft: #3F1E2C;
    --good: #3BCB84; --on-good: #0B1F15; --cta: #FF8A2A; --cta-deep: #B95412; --on-cta: #2A1405;
    --punch: #FF7A64; --punch-deep: #B04A38; --badge: #EEF2FB; --on-badge: #111729; --focus: #5FAEF6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky-bg: #16203A; --card: #1B2338; --ink: #EEF2FB; --ink-soft: #A9B2C8; --line: #2D3852; --dim: #2A3450; --star-off: #36405A;
  --scrim: rgba(0, 0, 0, 0.62);
  --sun: #FFC23D; --sun-soft: #3A3014; --sky: #5FAEF6; --sky-soft: #15304D;
  --leaf: #3BCB84; --leaf-soft: #12382A; --tomato: #FF7A64; --tomato-soft: #40211B;
  --grape: #A88AFF; --grape-soft: #2B2348; --berry: #FF7AA8; --berry-soft: #3F1E2C;
  --good: #3BCB84; --on-good: #0B1F15; --cta: #FF8A2A; --cta-deep: #B95412; --on-cta: #2A1405;
  --punch: #FF7A64; --punch-deep: #B04A38; --badge: #EEF2FB; --on-badge: #111729; --focus: #5FAEF6;
  color-scheme: dark;
}
:root[data-lang="th"] { --font-text: "Mali", "Noto Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif; }

[data-act="count"]   { --acc: var(--sun);    --acc-soft: var(--sun-soft); }
[data-act="symbols"] { --acc: var(--berry);  --acc-soft: var(--berry-soft); }
[data-act="add"]     { --acc: var(--leaf);   --acc-soft: var(--leaf-soft); }
[data-act="sub"]     { --acc: var(--tomato); --acc-soft: var(--tomato-soft); }
[data-act="ten"]     { --acc: var(--grape);  --acc-soft: var(--grape-soft); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; }
body {
  margin: 0; background: var(--sky-bg); color: var(--ink);
  font-family: var(--font-text); font-size: 17px; line-height: 1.55;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input { -webkit-user-select: text; user-select: text; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
h1, h2, h3 { text-wrap: balance; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.screen {
  position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px; pointer-events: none;
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen > * { pointer-events: auto; }
.screen > .pass { pointer-events: none; flex: 1; min-height: 60px; }

.round-btn {
  width: 46px; height: 46px; flex: none; border-radius: 50%; padding: 0;
  display: grid; place-items: center; background: var(--card); border: 2.5px solid var(--line);
}
.round-btn.off { opacity: 0.5; }
.coin-chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px;
  border-radius: 999px; background: var(--card); border: 2.5px solid var(--line); font-weight: 700; font-size: 18px;
}
.coin {
  width: 22px; height: 22px; flex: none; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #FFE58A, #F5A900 60%, #C98A00);
  box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.15);
}

/* ---------- home ---------- */
.home-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.title-card { min-width: 0; padding: 8px 14px 10px; border-radius: 20px; background: var(--card); border: 2.5px solid var(--line); }
.title-card h1 { margin: 0; font-size: 22px; line-height: 1.35; }
.title-card p { margin: 2px 0 0; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
.top-tools { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; flex: none; }
.voice-warn { margin: 0; padding: 8px 12px; border-radius: 14px; background: var(--sun-soft); font-size: 14px; }
.no3d { display: grid; gap: 10px; justify-items: center; padding: 16px; border-radius: 20px; background: var(--card); text-align: center; }
.no3d p { margin: 0; }
.hint-tap { align-self: center; padding: 4px 12px; border-radius: 999px; background: var(--card); color: var(--ink-soft); font-size: 14px; }
.monster-row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; }
.nav-btn {
  width: 56px; height: 56px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); border: 3px solid var(--line); box-shadow: 0 4px 0 var(--line);
}
.nav-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.monster-card { min-width: 0; display: grid; gap: 4px; justify-items: center; padding: 8px 12px; border-radius: 20px; background: var(--card); border: 2.5px solid var(--line); text-align: center; }
.monster-card strong { font-size: 21px; line-height: 1.35; }
.monster-card small { font-size: 14px; color: var(--ink-soft); }
.buy-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--sun); color: var(--on-sun); font-weight: 700; }
.cities { display: flex; justify-content: center; gap: 8px; }
.city-chip {
  position: relative; width: 54px; height: 54px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); border: 3px solid var(--line); font-family: var(--font-emoji); font-size: 26px; line-height: 1;
}
.city-chip[aria-pressed="true"] { border-color: var(--cta); box-shadow: 0 0 0 4px var(--sun-soft); }
.city-chip:disabled { filter: grayscale(1); opacity: 0.55; cursor: default; }
.city-chip .done-mark {
  position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--good); color: var(--on-good); font-family: var(--font-num); font-size: 13px; font-weight: 700;
}
.play-btn {
  display: flex; align-items: center; justify-content: center; gap: 12px; min-height: 76px; padding: 6px 18px;
  border: 0; border-radius: 26px; background: var(--cta); color: var(--on-cta); box-shadow: 0 8px 0 var(--cta-deep);
  font-size: 30px; font-weight: 700; line-height: 1.2; text-align: left;
}
.play-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 var(--cta-deep); }
.play-btn small { display: block; font-size: 15px; font-weight: 600; }
.play-btn svg { width: 40px; height: 40px; fill: currentColor; }
.home-actions { display: grid; gap: 12px; }
.home-actions .play-btn:disabled { opacity: 0.55; cursor: default; }
.home-foot { display: flex; justify-content: center; }
.gate { position: relative; overflow: hidden; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--card); border: 2px dashed var(--line); color: var(--ink-soft); font-size: 14px; }
.gate-fill { position: absolute; inset: 0; background: var(--dim); transform: scaleX(0); transform-origin: left; }
.gate.holding .gate-fill { transform: scaleX(1); transition: transform 2s linear; }
.gate-text { position: relative; }

/* ---------- practice with a grown-up ---------- */
.practice {
  position: fixed; inset: 0; z-index: 2; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sky-soft);
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
    max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
}
.practice-shell { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }
.practice-header { display: flex; align-items: center; gap: 10px; }
.practice-header h1 { font-size: clamp(20px, 5.2vw, 27px); margin: 0; }
.practice-panel { display: grid; gap: 12px; padding: clamp(12px, 4vw, 24px); border: 2px solid var(--line); border-radius: 22px; background: var(--card); }
.practice-panel h2, .practice-panel p { margin: 0; }
.practice-panel h2 { font-size: 20px; }
.practice-rounds, .practice-answer-actions { display: flex; gap: 8px; }
.practice-rounds .btn, .practice-answer-actions .btn { flex: 1; min-width: 0; padding-inline: 8px; }
.practice-rounds [aria-pressed="true"] { background: var(--sky-soft); border-color: var(--sky); }
.practice-outcome { display: grid; gap: 8px; }
.practice-drawing { display: grid; gap: 8px; }
.practice-drawing-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.practice-drawing-head h3 { margin: 0; font-size: 16px; }
.practice-drawing-head .practice-creature { --creature-size: 42px; }
.practice-drawing-title { display: flex; align-items: center; gap: 4px; }
.practice-canvas {
  display: block; width: 100%; height: clamp(124px, 24dvh, 235px); min-height: 124px;
  border-radius: 14px; outline: 2px solid var(--line); outline-offset: -2px;
  background: #fff; touch-action: none; cursor: crosshair;
}
.practice-canvas[data-sides] {
  background: #fff repeating-linear-gradient(to bottom, #a8bbd1 0 4px, transparent 4px 9px) center / 1px 100% no-repeat;
}
.practice-sketch-tools { display: flex; gap: 8px; }
.practice-sketch-tools .btn, .practice-drawing-head .btn { min-height: 44px; padding-inline: 9px; font-size: 14px; }
.practice-ink { display: grid; place-items: center; width: 44px; }
.practice-ink::before { content: ""; background: var(--ink-color); width: 19px; height: 19px; border-radius: 50%; }
.practice-ink[aria-pressed="true"] { border-color: var(--focus); }
.practice-sketch-tools .btn:disabled { opacity: 0.55; cursor: default; }
.practice-lesson {
  display: flex; align-items: center; gap: 12px; padding: 12px;
  background: var(--card); border: 2px solid var(--line); border-radius: 16px; text-align: start;
}
.practice-lesson:hover { border-color: var(--sky); }
.practice-lesson strong, .practice-lesson small { display: block; }
.practice-lesson small { color: var(--ink-soft); }
.practice-lesson .lesson-level { font-weight: 700; }
.practice-sign {
  display: grid; place-items: center; flex: 0 0 58px; height: 58px; border-radius: 12px;
  background: var(--sun-soft);
}
#practiceSub .practice-sign { background: var(--sky-soft); }
#practiceCompareLesson .practice-sign { background: var(--leaf-soft); }
#practiceFill .practice-sign { background: var(--grape-soft); }
.practice-progress { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.practice-progress span { color: var(--ink-soft); white-space: nowrap; font-size: 15px; }
.practice-equation { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: clamp(32px, 9vw, 48px); font-weight: 700; line-height: 1.1; }
.practice-equation .blank { display: grid; place-items: center; min-width: 48px; min-height: 48px; padding: 0 5px; border: 2px dashed var(--sky); border-radius: 12px; }
.practice-bond { display: grid; grid-template-columns: 1fr 1fr; justify-items: center; width: min(100%, 220px); margin: 0 auto; }
.practice-bond span {
  display: grid; place-items: center; width: 52px; height: 52px; border: 2px solid var(--sky);
  border-radius: 12px; background: var(--sky-soft); font-size: 30px; font-weight: 700; line-height: 1;
}
#practiceBondWhole { grid-column: 1 / -1; background: var(--card); }
#practiceBondOther { border-color: var(--sun); background: var(--sun-soft); }
.practice-bond .blank { border-style: dashed; }
.practice-bond-links { grid-column: 1 / -1; width: 50%; height: 26px; display: grid; grid-template-columns: 1fr 1fr; }
.practice-bond-links::before, .practice-bond-links::after {
  content: ""; background: linear-gradient(to bottom right, transparent calc(50% - 1px), var(--ink-soft) 50%, transparent calc(50% + 1px));
}
.practice-bond-links::after { transform: scaleX(-1); }
.practice-instruction { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; }
#practiceSpeak { font-family: var(--font-emoji); font-size: 23px; }
.practice-compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.practice-compare-row { display: grid; align-content: start; min-width: 0; gap: 4px; padding: 6px; border-radius: 10px; background: var(--sky-soft); }
.practice-compare-row[data-second] { background: var(--sun-soft); }
.practice-compare-row strong { font-size: 14px; }
.practice-compare-stars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px; }
.practice-compare-stars > span {
  display: grid; place-items: center; min-height: 25px; border: 1px solid transparent;
  border-radius: 6px; color: var(--ink); font-size: clamp(15px, 5vw, 24px); line-height: 1;
}
.practice-compare-stars .extra { border: 1px dashed var(--ink-soft); background: var(--card); }
.practice-compare-stars .empty { border: 1px dotted var(--ink-soft); opacity: 0.55; }
.practice-creature {
  display: inline-block; flex: none; width: var(--creature-size, 36px); max-width: 100%; aspect-ratio: 1;
  background: url("icons/practice-creatures.webp") var(--species, 0%) var(--stage, 0%) / 400% 300% no-repeat;
}
.practice-creature[data-species="sub"] { --species: 33.3333%; }
.practice-creature[data-species="compare"] { --species: 66.6667%; }
.practice-creature[data-species="fill"] { --species: 100%; }
.practice-creature[data-stage="1"] { --stage: 50%; }
.practice-creature[data-stage="2"] { --stage: 100%; }
.practice-sign .practice-creature { --creature-size: 55px; }
.practice-compare-stars .practice-creature { --creature-size: 30px; max-width: calc(100% - 3px); }
.practice-part .practice-creature { --creature-size: 30px; }
.practice-companion { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: var(--leaf-soft); }
.practice-companion .practice-creature { --creature-size: 66px; }
.practice-companion strong, .practice-companion small { display: block; }
#practiceGrowth .practice-creature { animation: pop 0.35s ease-out; }
.practice-tray {
  width: min(100%, 332px); margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: clamp(3px, 1.4vw, 8px); padding: 6px; border-radius: 14px; background: var(--sky-soft);
}
.practice-cell {
  display: grid; place-items: center;
  min-width: 0; min-height: 44px; padding: 0; aspect-ratio: 1;
  border: 2px solid transparent; border-radius: 10px;
  background: #DCEBFC; color: #174B7D; font-size: clamp(22px, 7vw, 34px); line-height: 1;
}
.practice-cell:disabled { cursor: default; }
.practice-cell.empty { border: 2px dashed var(--sky); background: var(--card); color: var(--ink-soft); }
.practice-cell.added { background: #FFE29A; color: #774300; border-radius: 50%; animation: pop 0.2s ease-out; }
.practice-cell.removed { border: 2px dashed var(--line); background: var(--card); color: var(--ink-soft); }
.practice-count { text-align: center; font-size: 16px; font-weight: 700; }
.practice-choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.practice-choices .btn { min-height: 52px; padding: 0; font-size: 28px; }
.practice-choices [data-wrong] { border-color: var(--sun); background: var(--sun-soft); }
.practice-model { display: grid; gap: 10px; padding: 12px; border: 2px solid var(--line); border-radius: 16px; }
.practice-model h3 { margin: 0; font-size: 17px; }
.practice-model-stars {
  display: grid; padding: 5px; border: 2px solid var(--sky); border-radius: 12px;
  min-width: 0; gap: 3px; transition: gap 0.2s;
}
.practice-model-stars[data-split] { gap: 14px; border-color: transparent; }
.practice-part {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); place-items: center;
  min-height: 42px; min-width: 0; border: 2px solid transparent; border-radius: 7px;
  background: #DCEBFC; color: #174B7D; font-size: clamp(16px, 4.5vw, 25px); line-height: 1;
}
.practice-part.other { background: #FFE29A; color: #774300; border-radius: 999px; }
.practice-model-stars[data-split] .practice-part:first-child { border: 2px dashed #3873A9; }
.practice-model-labels { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 14px; font-weight: 700; }
.practice-model-labels span { padding: 2px 8px; border-radius: 7px; background: #DCEBFC; color: #174B7D; }
.practice-model-labels span + span { border-radius: 999px; background: #FFE29A; color: #774300; }
.practice-model-equation { text-align: center; font-size: 30px; font-weight: 700; line-height: 1.25; }
.practice-guide { padding: 8px 12px; border-radius: 12px; background: var(--sky-soft); font-size: 15px; }
.practice-guide strong { display: block; }
.practice .btn.cta { background: var(--sun); border-color: var(--sun); color: var(--on-sun); box-shadow: 0 4px 0 var(--cta-deep); }

/* ---------- play: HUD and question card ---------- */
.hud { display: flex; align-items: center; gap: 8px; }
.hud-mid { flex: 1; min-width: 0; display: flex; justify-content: center; }
.pips { display: flex; gap: 5px; padding: 9px 12px; border-radius: 999px; background: var(--card); border: 2.5px solid var(--line); }
.pip { width: 16px; height: 16px; border-radius: 5px; background: var(--dim); }
.pip.on { background: var(--sun); }
.boss-bar { width: 100%; max-width: 240px; display: grid; gap: 4px; padding: 5px 12px 7px; border-radius: 14px; background: var(--card); border: 2.5px solid var(--line); font-size: 14px; font-weight: 700; line-height: 1.3; }
.hp { display: block; height: 12px; overflow: hidden; border-radius: 999px; background: var(--dim); }
.hp-fill { display: block; width: 100%; height: 100%; border-radius: 999px; background: var(--good); transition: width 0.4s ease, background-color 0.3s; }
.hp-fill.mid { background: var(--sun); }
.hp-fill.low { background: var(--tomato); }

.qcard {
  width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px 12px; border-radius: 22px; background: var(--card); border: 2.5px solid var(--line);
  box-shadow: 0 6px 0 rgba(16, 36, 28, 0.14);
}
.q-head { display: flex; align-items: center; gap: 10px; }
.q-bear, .cut-bear {
  width: 46px; height: 46px; flex: none; padding: 0; border-radius: 50%; display: grid; place-items: center;
  background: var(--sun-soft); border: 2.5px solid var(--sun); font-family: var(--font-emoji); font-size: 26px; line-height: 1;
}
.talk { animation: talk 0.45s ease-in-out 2; }
#prompt { flex: 1; min-width: 0; margin: 0; font-size: 18px; font-weight: 600; line-height: 1.6; }
:root[data-lang="lo"] #prompt, :root[data-lang="lo"] #cutText { line-height: 1.75; }
#scene { display: flex; flex-direction: column; gap: 6px; }
#scene:empty { display: none; }
.scene-body { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.trays { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tray { display: grid; grid-template-columns: repeat(5, var(--cell)); gap: 4px; padding: 6px; border-radius: 12px; background: var(--acc-soft); }
.tray.none { display: block; padding: 8px 16px; color: var(--ink-soft); font-size: 15px; }
.obj {
  position: relative; width: var(--cell); height: var(--cell); padding: 0; border: 0; border-radius: 9px;
  display: grid; place-items: center; background: transparent;
  font-family: var(--font-emoji); font-size: calc(var(--cell) * 0.66); line-height: 1;
}
button.obj:active { transform: scale(0.9); }
.obj.counted { background: var(--card); }
.obj.counted::after {
  content: attr(data-n); position: absolute; top: -7px; right: -7px; min-width: 21px; height: 21px; padding: 0 5px;
  border-radius: 11px; background: var(--badge); color: var(--on-badge); font: 600 13px/21px var(--font-num); text-align: center;
}
.obj.pop { animation: pop 0.32s ease; }
.obj.wiggle { animation: shake 0.3s ease; }
.obj.leaving { outline: 2px dashed var(--ink-soft); outline-offset: -3px; }
.obj.leaving .emo { opacity: 0.25; filter: grayscale(1); }
.obj.slot { border: 2px dashed var(--acc); background: var(--card); }
.obj.slot .emo { opacity: 0; }
.obj.slot.counted .emo { opacity: 0.4; }
.plus { font-size: 30px; font-weight: 700; line-height: 1; color: var(--ink-soft); }
.scene-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--ink-soft); font-size: 13px; }
.recount { display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; }
.recount svg.i { width: 16px; height: 16px; }
.expr { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 34px; font-weight: 700; line-height: 1; padding-block: 2px; }
.expr:empty { display: none; }
.expr .unit { font-family: var(--font-text); font-size: 20px; font-weight: 600; }
.expr .q, .big-eq .q, .sym .q {
  display: inline-grid; place-items: center; min-width: 46px; height: 46px; padding: 0 6px;
  border: 3px dashed var(--acc); border-radius: 12px;
}
.expr .q.filled, .big-eq .q.filled, .sym .q.filled { border-style: solid; border-color: var(--good); background: var(--good); color: var(--on-good); }
.big-eq { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; font-size: 44px; font-weight: 700; line-height: 1; padding-block: 4px; }
.help-row { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--ink-soft); font-size: 14px; text-align: center; }
.help-btn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 2px dashed var(--acc); background: var(--acc-soft); color: var(--ink); font-size: 15px; font-weight: 600; }
.sym { --cell: 15px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 8px; width: 100%; }
@media (min-width: 480px) { .sym { --cell: 20px; } }
.sym-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.sym-num { font-size: 44px; font-weight: 700; line-height: 1.1; }
.sym .tray { gap: 3px; padding: 5px; }
.dot { width: var(--cell); height: var(--cell); border-radius: 50%; background: var(--acc); }
.dot.extra { background: var(--sun); box-shadow: 0 0 0 3px var(--sun-soft); }
.float.combo { background: var(--sun); color: var(--on-sun); font-size: 20px; }
#game .qcard { background: var(--card); }
@supports (background: color-mix(in srgb, red 50%, transparent)) {
  #game .qcard { background: color-mix(in srgb, var(--card) 90%, transparent); }
}
/* phones held upright: only the padding gets tighter; text, numbers and things to tap keep their size */
@media (orientation: portrait) {
  #game .qcard { gap: 6px; padding: 8px 10px 10px; border-radius: 20px; }
  #game #prompt { line-height: 1.5; }
}
.combo-tag { align-self: center; padding: 3px 14px; border-radius: 999px; background: var(--sun); color: var(--on-sun); font-size: 15px; font-weight: 700; }

/* ---------- play: thumbs ---------- */
.controls { position: fixed; inset: auto 0 0 0; z-index: 5; height: 0; pointer-events: none; }
.act-btn, .super-btn { position: fixed; pointer-events: auto; border: 0; display: grid; place-items: center; }
.act-btn {
  right: max(18px, calc(env(safe-area-inset-right, 0px) + 12px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  width: 96px; height: 96px; border-radius: 50%; background: var(--punch); box-shadow: 0 7px 0 var(--punch-deep);
  font-family: var(--font-emoji); font-size: 46px; line-height: 1;
}
.act-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--punch-deep); }
.super-btn {
  right: max(126px, calc(env(safe-area-inset-right, 0px) + 120px)); bottom: calc(34px + env(safe-area-inset-bottom, 0px));
  width: 74px; height: 74px; padding: 6px; border-radius: 50%;
  background: conic-gradient(var(--sun) calc(var(--charge, 0) * 120deg), var(--dim) 0);
}
.super-btn span { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; background: var(--card); font-family: var(--font-emoji); font-size: 30px; line-height: 1; }
.super-btn.ready { animation: ready 0.9s ease-in-out infinite; }
.controls.off .act-btn, .controls.off .super-btn { opacity: 0.4; }
.stick-hint {
  position: fixed; left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(36px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 260px); padding: 6px 12px; border-radius: 999px; background: var(--card); color: var(--ink-soft); font-size: 14px; line-height: 1.5;
}
.joy { position: fixed; z-index: 6; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; background: rgba(255, 255, 255, 0.28); border: 3px solid rgba(255, 255, 255, 0.8); pointer-events: none; }
.joy-knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255, 255, 255, 0.92); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.25); }

/* ---------- story scenes ---------- */
.cut {
  position: fixed; z-index: 8; left: 0; right: 0; bottom: 0; pointer-events: none;
  padding-top: 14px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.cut-box {
  pointer-events: auto; max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 22px; background: var(--card); border: 3px solid var(--line); box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
  animation: rise-in 0.35s ease;
}
#cutText { flex: 1; min-width: 0; margin: 0; font-size: 19px; font-weight: 600; line-height: 1.6; }
.cut-skip {
  position: fixed; z-index: 9; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--card); border: 2.5px solid var(--line); font-weight: 700;
}

/* ---------- floating numbers, toast, win card ---------- */
.floats { position: fixed; inset: 0; z-index: 7; pointer-events: none; overflow: hidden; }
.float { position: absolute; padding: 2px 12px; border-radius: 999px; font-size: 22px; font-weight: 700; white-space: nowrap; transform: translate(-50%, -100%); animation: rise 0.95s ease-out forwards; }
.float.dmg { background: var(--punch); color: var(--on-cta); font-family: var(--font-num); font-size: 26px; }
.float.coin { background: var(--sun); color: var(--on-sun); font-family: var(--font-num); }
.float.say { background: var(--card); color: var(--ink); font-size: 18px; }
.toast {
  position: fixed; z-index: 20; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom, 0px)); translate: -50% 0;
  max-width: calc(100% - 32px); padding: 10px 20px; border-radius: 999px; background: var(--badge); color: var(--on-badge);
  font-size: 17px; font-weight: 700; text-align: center; animation: pop 0.35s ease;
}
.overlay {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--scrim);
  padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.win-card { width: 100%; max-width: 420px; display: grid; gap: 10px; justify-items: center; padding: 24px 20px; border-radius: 28px; background: var(--card); text-align: center; animation: pop 0.45s ease; }
.win-card h2 { margin: 0; font-size: 30px; line-height: 1.35; }
.win-card p { margin: 0; color: var(--ink-soft); font-size: 17px; }
.rating { display: flex; gap: 10px; color: var(--star-off); }
.rating svg { width: 54px; height: 54px; }
.rating .on { color: var(--sun); }
.win-coins { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 999px; background: var(--sun-soft); font-weight: 700; }
.win-actions { display: grid; gap: 12px; width: 100%; margin-top: 6px; }
.btn { min-height: 60px; padding: 0 20px; border-radius: 20px; background: var(--card); border: 2.5px solid var(--line); box-shadow: 0 5px 0 var(--line); font-size: 20px; font-weight: 700; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.btn.cta { background: var(--cta); border-color: var(--cta); color: var(--on-cta); box-shadow: 0 5px 0 var(--cta-deep); }
.btn.small { min-height: 48px; font-size: 16px; box-shadow: none; }
.btn.small:active { transform: none; }
.btn.warn { background: var(--tomato); border-color: var(--tomato); color: var(--on-cta); }

/* ---------- parent corner ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; padding-top: calc(24px + env(safe-area-inset-top, 0px)); background: var(--scrim); }
.sheet {
  width: 100%; max-width: 600px; max-height: 100%; overflow: auto; background: var(--card); border-radius: 26px 26px 0 0;
  padding-top: 18px; padding-bottom: calc(26px + env(safe-area-inset-bottom, 0px));
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px));
  -webkit-user-select: text; user-select: text;
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.sheet h2 { margin: 0; font-size: 24px; }
.sheet h3 { margin: 22px 0 8px; font-size: 18px; }
.sheet-note { margin: 4px 0 10px; color: var(--ink-soft); font-size: 15px; }
.lang-row { display: grid; gap: 6px; margin-top: 10px; }
.lang-row > span { font-size: 15px; font-weight: 600; color: var(--ink-soft); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 16px; background: var(--dim); }
.seg button { min-height: 48px; border: 0; border-radius: 12px; background: transparent; color: var(--ink-soft); font-size: 18px; font-weight: 700; }
.seg button[aria-checked="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
.seg button[data-lang="lo"] { font-family: "Noto Sans Lao", system-ui, sans-serif; }
.seg button[data-lang="th"] { font-family: "Mali", "Noto Sans Thai", system-ui, sans-serif; }
.field { display: grid; gap: 6px; margin-top: 10px; }
.field label { font-size: 15px; font-weight: 600; color: var(--ink-soft); }
.field input { min-height: 52px; padding: 0 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--dim); color: var(--ink); font: inherit; }
.switches { display: grid; gap: 2px; margin-top: 10px; }
.switch { display: flex; align-items: center; gap: 12px; min-height: 46px; font-size: 17px; cursor: pointer; }
.switch input { width: 26px; height: 26px; flex: none; accent-color: var(--good); }
.voice-note { margin: 8px 0; padding: 10px 14px; border-radius: 14px; background: var(--dim); font-size: 15px; line-height: 1.55; }
.voice-note[data-state="warn"] { background: var(--sun-soft); }
.voice-note[data-state="ok"] { background: var(--leaf-soft); }
.prows { display: grid; gap: 8px; }
.prow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px; padding: 10px 12px; border-radius: 14px; background: var(--dim); }
.prow strong { font-size: 16px; }
.prow small { grid-column: 1; color: var(--ink-soft); font-size: 14px; }
.pstep { grid-row: 1 / span 2; grid-column: 2; display: flex; align-items: center; gap: 6px; }
.pstep button { width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-family: var(--font-num); font-size: 22px; font-weight: 700; }
.pstep b { min-width: 58px; text-align: center; font-size: 15px; }
.pstep button:disabled { opacity: 0.35; cursor: default; }
.install { display: grid; gap: 6px; justify-items: start; margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--sky-soft); }
.install h3 { margin: 0; }
.install .sheet-note { margin: 0; color: var(--ink); }
.days { display: grid; gap: 6px; }
.day { display: grid; gap: 6px; padding: 8px 12px; border-radius: 12px; background: var(--dim); font-size: 14px; }
.day-bar { display: block; height: 8px; overflow: hidden; border-radius: 999px; background: var(--line); }
.day-bar span { display: block; height: 100%; border-radius: 999px; background: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 4px 12px; border-radius: 999px; background: var(--dim); font-size: 17px; font-weight: 600; }
.chips .empty { color: var(--ink-soft); font-family: var(--font-text); font-size: 15px; }
.tips { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 15px; line-height: 1.6; }
.danger { display: grid; gap: 10px; margin-top: 22px; }
.danger-ask { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: var(--tomato-soft); font-size: 15px; }
.danger-ask div { display: flex; flex-wrap: wrap; gap: 10px; }

.confetti span { position: fixed; z-index: 35; top: -48px; font-family: var(--font-emoji); font-size: 30px; pointer-events: none; animation: fall linear forwards; }

/* ---------- wide screens (phones held sideways, tablets, computers): the city keeps the middle of the
   screen like a real game. The question card becomes a slim quest panel on the left, and the home
   buttons stack in a column on the right. ---------- */
@media (orientation: landscape) {
  #home { display: grid; grid-template-columns: minmax(0, 1fr) minmax(270px, min(36%, 400px)); grid-template-rows: auto minmax(0, 1fr) auto auto auto auto auto; column-gap: 16px; row-gap: 10px; }
  #home > .home-top { grid-column: 1 / -1; }
  #home > .pass { grid-column: 1; grid-row: 2 / -1; min-height: 0; }
  #home > :not(.home-top):not(.pass) { grid-column: 2; }
  #home > .voice-warn, #home > .no3d { grid-row: 2; align-self: end; }
  #home > .hint-tap { grid-row: 3; }
  #home > .monster-row { grid-row: 4; }
  #home > .cities { grid-row: 5; }
  #home > .home-actions { grid-row: 6; }
  #home > .home-foot { grid-row: 7; }
  #game .qcard {
    position: fixed; z-index: 3; margin: 0; --cell: 24px; gap: 6px; padding: 8px 10px 10px;
    top: calc(66px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px));
    width: clamp(240px, 25vw, 330px); max-height: calc(100% - 150px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow-y: auto; border-radius: 20px; box-shadow: 0 4px 0 rgba(16, 36, 28, 0.12);
  }
  #game .q-bear { width: 40px; height: 40px; font-size: 22px; }
  #game #prompt { font-size: 16px; line-height: 1.5; }
  #game .expr { font-size: 28px; }
  #game .expr .q, #game .big-eq .q, #game .sym .q { min-width: 40px; height: 40px; }
  #game .big-eq { font-size: 34px; }
  #game .sym-num { font-size: 34px; }
  #game .sym { --cell: 14px; }
  #game .scene-foot { flex-wrap: wrap; }
  .stick-hint { max-width: 34vw; }
}
@media (orientation: landscape) and (max-height: 560px) {
  #home > .hint-tap { display: none; }
  #home .play-btn { min-height: 60px; font-size: 26px; }
  #home .nav-btn { width: 48px; height: 48px; }
  #home .city-chip { width: 46px; height: 46px; font-size: 22px; }
  #home .monster-card { padding: 4px 10px; }
  .title-card p { display: none; }
  #game .qcard { --cell: 20px; width: min(300px, 38vw); }
}
@media (max-height: 700px) {
  #home { overflow-y: auto; }
  #home > .pass { min-height: 20px; }
  #home > .hint-tap { display: none; }
  #home .play-btn { min-height: 60px; }
}

@keyframes pop { 0% { transform: scale(0.7); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { translate: 0; } 25% { translate: -6px; } 75% { translate: 6px; } }
@keyframes talk { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-8deg) scale(1.06); } 70% { transform: rotate(6deg); } }
@keyframes rise { 0% { opacity: 0; margin-top: 10px; } 20% { opacity: 1; margin-top: 0; } 100% { opacity: 0; margin-top: -46px; } }
@keyframes rise-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
@keyframes ready { 0%, 100% { box-shadow: 0 0 0 0 var(--sun-soft); } 50% { box-shadow: 0 0 0 10px var(--sun-soft); } }
@keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>

<section class="screen" id="home">
  <div class="home-top">
    <div class="title-card"><h1 id="appTitle"></h1><p id="tagline"></p></div>
    <div class="top-tools">
      <span class="coin-chip"><span class="coin" aria-hidden="true"></span><span class="num" id="homeCoins">0</span></span>
      <button class="round-btn" id="musicHome" type="button"></button>
    </div>
  </div>
  <div class="pass"></div>
  <p class="voice-warn" id="homeVoice" hidden></p>
  <div class="no3d" id="no3d" hidden><p id="no3dText"></p><button class="btn small" id="retry" type="button"></button></div>
  <span class="hint-tap" id="tapHint" hidden></span>
  <div class="monster-row" hidden>
    <button class="nav-btn" id="prevMon" type="button"></button>
    <div class="monster-card">
      <strong id="monName"></strong>
      <small id="monInfo"></small>
      <button class="buy-btn" id="buyBtn" type="button" hidden><span class="coin" aria-hidden="true"></span><span class="num" id="buyCost"></span><span id="buyLabel"></span></button>
    </div>
    <button class="nav-btn" id="nextMon" type="button"></button>
  </div>
  <div class="cities" id="cities" hidden></div>
  <div class="home-actions">
    <button class="play-btn" id="playBtn" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
      <span><span id="playLabel"></span><small id="playCity"></small></span>
    </button>
    <button class="btn small" id="practiceBtn" type="button"></button>
  </div>
  <div class="home-foot">
    <button class="gate" id="parentBtn" type="button"><span class="gate-fill"></span><span class="gate-text" id="gateText"></span></button>
  </div>
</section>

<section class="practice" id="practice" aria-labelledby="practiceTitle" hidden>
  <div class="practice-shell">
    <header class="practice-header">
      <button class="round-btn" id="practiceBack" type="button"></button>
      <h1 id="practiceTitle"></h1>
    </header>
    <div class="practice-panel" id="practiceMenu">
      <p id="practiceIntro"></p>
      <div class="practice-rounds" id="practiceRounds" role="group">
        <button class="btn small" id="practiceShortRound" data-round="short" aria-pressed="true" type="button"></button>
        <button class="btn small" id="practiceFullRound" data-round="full" aria-pressed="false" type="button"></button>
      </div>
      <button class="practice-lesson" id="practiceAdd" data-lesson="add" type="button">
        <span class="practice-sign" aria-hidden="true"><span class="practice-creature"></span></span>
        <span><strong class="lesson-name"></strong><small class="lesson-intro"></small><small class="lesson-level"></small></span>
      </button>
      <button class="practice-lesson" id="practiceSub" data-lesson="sub" type="button">
        <span class="practice-sign" aria-hidden="true"><span class="practice-creature"></span></span>
        <span><strong class="lesson-name"></strong><small class="lesson-intro"></small><small class="lesson-level"></small></span>
      </button>
      <button class="practice-lesson" id="practiceCompareLesson" data-lesson="compare" type="button">
        <span class="practice-sign" aria-hidden="true"><span class="practice-creature"></span></span>
        <span><strong class="lesson-name"></strong><small class="lesson-intro"></small><small class="lesson-level"></small></span>
      </button>

      t.gem = P(holder, GEO.gem, std(t.accent, { emissive: t.accent, ei: 0.55, rough: 0.2, metal: 0.1 }), 0, 1.7, 0, 1.0, 1.4, 1.0);
      P(holder, GEO.cyl, std("#5B6478", { rough: 0.7 }), 0, 0.2, 0, 1.0, 0.4, 1.0).receiveShadow = true;
    }
    t.badge = sprite(badgeTex(value, "", t.accent), 2.5);
    t.badge.position.y = kind === "bug" ? MINION_H + 1.6 : 4.3;
    holder.add(t.badge);
    t.hit = P(holder, GEO.box, HIT, 0, 2.3, 0, 3.2, 4.8, 3.2);
    t.hit.castShadow = false;
    t.hit.userData.target = t;
    world.scene.add(holder);
    holder.scale.setScalar(0.01);
    tween(0.45, (k) => holder.scale.setScalar(Math.max(0.01, k)), ease.back);
    puff(world.scene, V(x, 0.3, z), 5);
    return t;
  }
  function removeTarget(t) {
    t.alive = false;
    world.scene.remove(t.holder);
    t.badge.material.dispose();
  }
  function clearAnswerTargets() {
    if (!G) return;
    [...G.bugs, ...G.gems].forEach((t) => { if (t.alive) removeTarget(t); });
    G.bugs = [];
    G.gems = [];
  }
  function spawnBugs(choices) {
    clearAnswerTargets();
    const spread = innerWidth < innerHeight ? 0.55 : 1.0;
    const p = G.hero.root.position, front = p.z + 12.3, back = 14 - p.z;
    const dir = front >= 8 || front >= back ? -1 : 1, room = Math.max(6.5, dir < 0 ? front : back);
    const angles = shuffle([-spread, 0, spread]), placed = [];
    G.bugs = choices.map((value, i) => {
      let x = 0, z = 0;
      for (let k = 0; k < 14; k++) {
        const a = angles[i] + rf(-0.1, 0.1) * (spread > 0.6 ? 2.5 : 1), d = rf(6.5, Math.min(10.5, room));
        x = clamp(p.x + Math.sin(a) * d, -12.3, 12.3);
        z = clamp(p.z + dir * Math.cos(a) * d, -12.3, 14);
        if (placed.every((o) => Math.hypot(o.x - x, o.z - z) > 5) && Math.hypot(p.x - x, p.z - z) > 5) break;
      }
      placed.push({ x, z });
      return makeAnswerTarget("bug", value, i, x, z);
    });
  }
  function spawnGems(choices) {
    clearAnswerTargets();
    const B = G.boss.root.position, H = G.hero.root.position;
    let dx = H.x - B.x, dz = H.z - B.z;
    const d = Math.hypot(dx, dz) || 1;
    dx /= d; dz /= d;
    const cx = B.x + dx * 6.5, cz = B.z + dz * 6.5, order = shuffle([-1, 0, 1]), w = innerWidth < innerHeight ? 4.3 : 5.5;
    G.gems = choices.map((value, i) => makeAnswerTarget("gem", value, i, clamp(cx - dz * order[i] * w, -12.3, 12.3), clamp(cz + dx * order[i] * w, -12.3, 14)));
  }
  function setBadge(t, state) { t.badge.material.map = badgeTex(t.value, state, t.accent); t.badge.material.needsUpdate = true; }
  function bounceTarget(t) { const h = t.holder; tween(0.4, (k) => { h.position.y = Math.sin(k * Math.PI) * 1.2; }, ease.lin); }
  function popTarget(t) {
    const at = V(t.pos.x, 1.4, t.pos.z);
    removeTarget(t);
    burst(world.scene, at, 14, [std("#FFD166"), std("#FF7AA8"), std("#7BDFF2"), std("#B8F35A")], 0.4, 10);
    puff(world.scene, at, 6);
  }
  function vanish(t) {
    t.alive = false;
    const h = t.holder;
    puff(world.scene, V(t.pos.x, 0.6, t.pos.z), 4);
    tween(0.3, (k) => h.scale.setScalar(Math.max(0.01, 1 - k)), ease.in).then(() => { world && world.scene.remove(h); t.badge.material.dispose(); });
  }

  /* Spaced practice: a question the child needed help with comes back two questions later, and again on
     another day, until it is answered right the first time without help. */
  function pickQuestion() {
    const kinds = G.city.kinds;
    const i = R.retry.findIndex((it) => it.due <= G.asked && kinds.includes(it.kind));
    if (i >= 0) { const it = R.retry.splice(i, 1)[0]; const q = build(it.kind, it.p); q.again = true; return q; }
    if (G.asked % 3 === 1) {
      const old = S.review.find((it) => kinds.includes(it.kind) && it.day !== today() && !R.seen.has(sigFor(it.kind, it.p)));
      if (old) { const q = build(old.kind, old.p); q.again = true; return q; }
    }
    const kind = pick(kinds), level = S.acts[kind].level;
    let q, guard = 0;
    do { q = GEN[kind](level); guard++; } while (R.seen.has(q.sig) && guard < 15);
    return q;
  }
  function remember(q) {
    R.retry = R.retry.filter((it) => sigFor(it.kind, it.p) !== q.sig);
    R.retry.push({ kind: q.kind, p: q.params, due: G.asked + 2 });
    S.review = S.review.filter((it) => sigFor(it.kind, it.p) !== q.sig);
    S.review.push({ kind: q.kind, p: q.params, day: today() });
    if (S.review.length > 12) S.review.shift();
    save();
  }
  function forget(q) {
    // learnt only when answered alone on a later day than the miss
    const before = S.review.length;
    S.review = S.review.filter((it) => sigFor(it.kind, it.p) !== q.sig || it.day === today());
    if (S.review.length !== before) save();
  }
  function nextQuestion() {
    if (!G || !G.on) return;
    token++;
    const q = pickQuestion(), kind = q.kind;
    R.act = kind;
    $("#game").dataset.act = kind;
    R.seen.add(q.sig);
    q.thing = pick(THINGS);
    Q = q; tries = 0; busy = false;
    G.asked++;
    G.idleT = 0;
    G.nudges = 0;
    $("#qcard").hidden = false;
    $("#prompt").textContent = (q.again ? "🔁 " : "") + askText();
    renderScene();
    renderExpr(false);
    if (G.boss) spawnGems(q.choices); else spawnBugs(q.choices);
    G.phase = G.boss ? "boss" : "bugs";
    $("#controls").classList.remove("off");
    updateSr();
    layoutChanged();
    if (q.again) say((D) => D.againSay).then(() => { if (Q === q && !busy) sayAsk(); });
    else sayAsk();
  }
  function updateSr() {
    const box = $("#choicesSr");
    box.innerHTML = "";
    if (!Q || !G) return;
    (G.boss ? G.gems : G.bugs).forEach((t) => {
      if (!t.alive || t.wrong) return;
      const b = el("button", "");
      b.type = "button";
      b.textContent = Q.kind === "symbols" ? T().symWord[t.value] : fmt(t.value);
      b.addEventListener("click", () => { if (canMove()) G.target = t; });
      box.append(b);
    });
  }
  function chooseByIndex(i) {
    if (!G || !canMove()) return;
    const t = (G.boss ? G.gems : G.bugs).find((o) => o.index === i && o.alive);
    if (t) G.target = t;
  }
  function answerHit(t) {
    if (!Q || busy || t.wrong || G.phase === "teach") { bounceTarget(t); sfx.boing(); return; }
    G.idleT = 0;
    sfx.hit();
    if (t.value === Q.answer) onRight(t); else onWrong(t);
  }
  async function onRight(t) {
    busy = true;
    const my = token, first = tries === 0;
    G.phase = "resolve";
    renderExpr(true);
    const change = record(first);
    if (!first) remember(Q); else if (Q.again) forget(Q);
    if (first) { G.first++; G.combo++; G.charge = Math.min(3, G.charge + 1); } else G.combo = 0;
    renderCombo();
    renderSuper();
    const gem = t.kind === "gem";
    popTarget(t);
    [...G.bugs, ...G.gems].forEach((o) => { if (o !== t && o.alive) vanish(o); });
    addCoins(first ? 3 : 1, t.pos);
    sfx.good();
    updateSr();
    const named = S.name && Math.random() < 0.35;
    const talk = say((D, N, l) => `${named ? D.praiseName(S.name) : pick(D.praise)} ${doneSay(D, N, l)}`);
    if (change > 0) toast(T().levelToast(fmt(S.acts[R.act].level)));
    if (gem) {
      await beamTo(t);
      if (my !== token || !G || !G.on) return;
      breakShield(first);
      busy = false;
      Q = null;
      showStunCard();
    } else {
      G.solved++;
      renderProgress();
    }
    await talk;
    if (my !== token || !G || !G.on) return;
    if (G.charge >= 3 && !G.superTold) { G.superTold = true; toast(T().superReady); }
    if (gem) { if (G.stunT > 0) say((D) => D.stunned); return; }
    if (G.solved >= NEED) { busy = false; bossIntro(); return; }
    await sleep(350);
    if (my !== token || !G || !G.on) return;
    nextQuestion();
  }
  async function onWrong(t) {
    busy = true;
    tries++;
    const my = token;
    t.wrong = true;
    setBadge(t, "no");
    bounceTarget(t);
    sfx.boing();
    G.combo = 0;
    renderCombo();
    G.phase = "teach";
    G.target = null;
    input.x = 0; input.z = 0;
    $("#joy").hidden = true;
    $("#controls").classList.add("off");
    updateSr();
    if (tries === 1) {
      await say((D) => D.together);
      if (my !== token) return;
      if (!await teach(my)) return;
      layoutChanged();
      await say((D) => D.againPick);
    } else {
      const right = [...G.bugs, ...G.gems].find((o) => o.alive && o.value === Q.answer);
      if (right) { right.hint = true; setBadge(right, "hint"); }
      await say((D, N) => D.reveal(Q.kind === "symbols" ? D.symWord[Q.answer] : N(Q.answer)));
    }
    if (my !== token || !G || !G.on) return;
    busy = false;
    G.phase = G.boss ? "boss" : "bugs";
    $("#controls").classList.remove("off");
  }

  /* ---------- the boss: crystals break its shield, then it can be punched ---------- */
  const SHIELD_R = BOSS_H * 0.72;
  function makeShield() {
    const m = new THREE.Mesh(GEO.sph, new THREE.MeshStandardMaterial({ color: lin("#7FE7FF"), emissive: lin("#3CC8FF"), emissiveIntensity: 0.5, transparent: true, opacity: 0.26, depthWrite: false, roughness: 0.2 }));
    const bp = G.boss.root.position;
    m.position.set(bp.x, BOSS_H * 0.5, bp.z);
    m.scale.setScalar(0.01);
    world.scene.add(m);
    G.shield = m;
    tween(0.5, (k) => m.scale.setScalar(Math.max(0.01, SHIELD_R * k)), ease.back);
    sfx.ting();
  }
  async function beamTo(t) {
    const B = G.boss.root.position, a = V(t.pos.x, 1.7, t.pos.z), b = V(B.x, BOSS_H * 0.55, B.z), len = a.distanceTo(b);
    const beam = new THREE.Mesh(GEO.cyl, new THREE.MeshBasicMaterial({ color: lin("#FFF3A0"), transparent: true, opacity: 0.9 }));
    beam.position.copy(a).lerp(b, 0.5);
    beam.lookAt(b);
    beam.rotateX(Math.PI / 2);
    beam.scale.set(0.3, 0.01, 0.3);
    world.scene.add(beam);
    sfx.beam();
    await tween(0.25, (k) => beam.scale.set(0.3, Math.max(0.01, len * k), 0.3), ease.out);
    await tween(0.3, (k) => { beam.material.opacity = 0.9 * (1 - k); beam.scale.x = beam.scale.z = 0.3 + k * 0.7; }, ease.lin);
    if (world) world.scene.remove(beam);
    beam.material.dispose();
  }
  function breakShield(first) {
    if (G.shield) {
      const at = G.shield.position.clone();
      world.scene.remove(G.shield);
      G.shield.material.dispose();
      G.shield = null;
      burst(world.scene, at, 18, [std("#9EEBFF", { emissive: "#3CC8FF", ei: 0.6, rough: 0.2 })], 0.5, 10);
    }
    sfx.glass();
    cam.shake = 1.0;
    G.stunT = first ? 6.5 : 4.5;
    G.stunHits = 0;
    G.stunCap = first ? 4 : 2;
    setDizzy(G.boss, true);
    G.boss.state = "idle";
    G.phase = "boss";
  }
  function showStunCard() {
    $("#prompt").textContent = T().stunned;
    $("#scene").innerHTML = "";
    $("#expr").innerHTML = "";
    $("#choicesSr").innerHTML = "";
    layoutChanged();
  }
  function endStun() {
    if (!G || G.bossDown) return;
    setDizzy(G.boss, false);
    G.boss.roarT = 1.1;
    sfx.voice(G.boss.voice);
    makeShield();
    G.bossTimer = rf(3, 5);
    nextQuestion();
  }
  function bossPunched() {
    const b = G.boss, bp = b.root.position;
    if (G.stunT > 0) {
      G.hp = Math.max(0, G.hp - 1);
      G.stunHits++;
      renderHp();
      b.hitT = 0.35;
      sfx.hit();
      cam.shake = 0.6;
      floatText(V(bp.x, BOSS_H + 0.5, bp.z), `−${fmt(1)}`, "dmg");
      const hp = G.hero.root.position, dx = bp.x - hp.x, dz = bp.z - hp.z, d = Math.hypot(dx, dz) || 1, fx = bp.x, fz = bp.z;
      tween(0.15, (k) => { bp.x = clamp(fx + (dx / d) * 0.8 * k, -15, 15); bp.z = clamp(fz + (dz / d) * 0.8 * k, -15, 15); }, ease.out);
      if (G.hp <= 0) { bossDefeated(); return; }
      if (G.stunHits >= G.stunCap) G.stunT = Math.min(G.stunT, 0.35);
    } else {
      sfx.ting();
      floatText(V(bp.x, BOSS_H * 0.75, bp.z), "🛡️", "say");
      if (performance.now() - G.shieldTold > 5000) { G.shieldTold = performance.now(); toast(T().shieldUp); }
    }
  }
  function updateBoss(dt) {
    const b = G.boss, bp = b.root.position, hp = G.hero.root.position;
    if (G.bossDown || G.phase === "cut") return;
    if (G.shield) G.shield.position.set(bp.x, BOSS_H * 0.5 + bp.y, bp.z);
    if (G.phase === "teach") { b.state = "idle"; return; }
    if (G.stunT > 0) { G.stunT -= dt; b.state = "idle"; if (G.stunT <= 0) endStun(); return; }
    if (G.stomping) return;
    const dx = hp.x - bp.x, dz = hp.z - bp.z, d = Math.hypot(dx, dz);
    turnToward(b.root, hp.x, hp.z, dt, 3);
    if (d > 7.5) { bp.x += (dx / d) * 1.7 * dt; bp.z += (dz / d) * 1.7 * dt; b.state = "walk"; } else b.state = "idle";
    bp.x = clamp(bp.x, -15, 15);
    bp.z = clamp(bp.z, -15, 15);
    G.bossTimer -= dt;
    if (G.bossTimer <= 0 && G.phase === "boss") { G.bossTimer = rf(6, 8.5); bossStomp(); }
  }
  /* a telegraphed jump-stomp: the red circle warns, the ring of air pushes the hero back but never hurts */
  async function bossStomp() {
    const bp = G.boss.root.position;
    G.stomping = true;
    const warn = new THREE.Mesh(GEO.disc, new THREE.MeshBasicMaterial({ color: lin("#FF4D4D"), transparent: true, opacity: 0.35, depthWrite: false }));
    warn.rotation.x = -Math.PI / 2;
    warn.position.set(bp.x, 0.05, bp.z);
    warn.scale.setScalar(0.1);
    world.scene.add(warn);
    await tween(0.8, (k) => { bp.y = Math.sin(k * Math.PI * 0.5) * 2.4; warn.scale.setScalar(1 + k * (WAVE_R - 1)); }, ease.out);
    await tween(0.16, (k) => { bp.y = 2.4 * (1 - k); }, ease.in);
    if (world) world.scene.remove(warn);
    warn.material.dispose();
    if (!G || !G.on || G.bossDown) return;
    G.stomping = false;
    sfx.boom();
    cam.shake = 1.1;
    puff(world.scene, V(bp.x, 0.4, bp.z), 10, "#D8C8B0", 1.3);
    const ring = new THREE.Mesh(GEO.ring, new THREE.MeshBasicMaterial({ color: lin("#FFFFFF"), transparent: true, opacity: 0.85, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(bp.x, 0.3, bp.z);
    world.scene.add(ring);
    G.waves.push({ m: ring, x: bp.x, z: bp.z, r: 0.5, hit: false });
  }
  const WAVE_R = 9.5;
  function updateWaves(dt) {
    for (let i = G.waves.length - 1; i >= 0; i--) {
      const w = G.waves[i];
      w.r += dt * 9;
      w.m.scale.set(w.r, w.r, 3);
      w.m.material.opacity = 0.85 * Math.max(0, 1 - w.r / WAVE_R);
      const hp = G.hero.root.position, d = Math.hypot(hp.x - w.x, hp.z - w.z);
      if (!w.hit && G.dizzy <= 0 && (G.phase === "boss" || G.phase === "resolve") && Math.abs(d - w.r) < 1.0) { w.hit = true; knockHero(w.x, w.z); }
      if (w.r >= WAVE_R) { world.scene.remove(w.m); w.m.material.dispose(); G.waves.splice(i, 1); }
    }
  }
  function knockHero(x, z) {
    const p = G.hero.root.position;
    let dx = p.x - x, dz = p.z - z;
    const d = Math.hypot(dx, dz) || 1;
    dx /= d; dz /= d;
    const fx = p.x, fz = p.z, tx = clamp(p.x + dx * 3, -ARENA, ARENA), tz = clamp(p.z + dz * 3, -ARENA, ARENA);
    tween(0.3, (k) => { p.x = fx + (tx - fx) * k; p.z = fz + (tz - fz) * k; p.y = Math.sin(k * Math.PI) * 1.5; }, ease.out).then(() => { p.y = 0; });
    G.dizzy = 1.0;
    setDizzy(G.hero, true);
    G.hero.hitT = 0.35;
    G.target = null;
    sfx.boing();
    floatText(V(p.x, HERO_H + 1, p.z), "💫", "say");
  }

  /* =====================================================================
     Story scenes: the camera flies, the bear narrates, a tap skips
     ===================================================================== */
  function waitSkip() { return new Promise((res) => { if (G) G.skipWaiters.push(res); else res(); }); }
  function startCut() {
    G.phase = "cut";
    G.skip = false;
    G.skipWaiters = [];
    cam.mode = "cut";
    input.x = 0; input.z = 0;
    G.target = null;
    ["#controls", "#qcard", "#combo", "#joy"].forEach((id) => { $(id).hidden = true; });
  }
  function endCut() {
    $("#cut").hidden = true;
    $("#cutSkip").hidden = true;
    cam.mode = "follow";
    G.skip = false;
    G.skipWaiters = [];
    $("#controls").hidden = false;
    $("#stickHint").hidden = G.moved || S.game.beaten.length > 0;
    layoutChanged();
  }
  function skipCut() {
    if (!G || G.phase !== "cut" || G.skip) return;
    G.skip = true;
    hush();
    finishTweens();
    G.skipWaiters.splice(0).forEach((r) => r());
  }
  /* a tap ends the line being read, so an eager child can hurry the story without missing it */
  function nextLine() {
    if (!G || G.phase !== "cut" || performance.now() - G.lineAt < 900) return;
    hush();
    G.skipWaiters.splice(0).forEach((r) => r());
  }
  async function narrate(build) {
    if (!G || G.skip) return;
    G.lineAt = performance.now();
    $("#cutText").textContent = build(T(), fmt, S.lang);
    $("#cut").hidden = false;
    $("#cutSkip").hidden = false;
    await Promise.race([say(build), waitSkip()]);
    if (!G || G.skip) return;
    await Promise.race([sleep(300), waitSkip()]);
  }
  async function introCutscene(my) {
    startCut();
    const city = G.city, hp = G.hero.root.position;
    cam.pos = V(0, 44, 52);
    cam.look = V(0, 0, -6);
    cam.shift = 0;
    cam.shiftX = 0;
    await camTo(V(0, 30, 38), V(0, 0, -8), 1.6);
    if (my !== token) return false;
    await narrate((D, N, l) => D.storyTrouble(city[l], monName(city.boss, l)));
    if (my !== token) return false;
    await camTo(V(5, 7, hp.z + 12), V(0, 3, hp.z - 2), 1.4);
    G.hero.roarT = 1.1;
    sfx.voice(G.hero.voice);
    await narrate((D, N, l) => D.storyGo(monName(S.game.monster, l)));
    if (my !== token) return false;
    if (!S.game.tutorial) {
      $("#controls").hidden = false;
      await narrate((D) => moveHint(D));
      S.game.tutorial = true;
      save();
      $("#controls").hidden = true;
    }
    if (my !== token) return false;
    await narrate((D) => D.minionGoal);
    if (my !== token) return false;
    endCut();
    return true;
  }
  async function bossIntro() {
    token++;
    const my = token, city = G.city;
    clearAnswerTargets();
    Q = null;
    startCut();
    musicPlay("boss");
    const boss = makeMonster(city.boss, BOSS_H);
    const z0 = city.water ? -40 : -30;
    boss.root.position.set(0, -BOSS_H - 1, z0);
    boss.root.rotation.y = Math.PI;
    world.scene.add(boss.root);
    G.boss = boss;
    G.hp = G.max = city.hp;
    G.bossT = { kind: "boss", pos: boss.root.position, r: 2.8, alive: true };
    const nat = boss.natural;
    const hb = P(boss.root, GEO.box, HIT, 0, nat / 2, 0, nat * 0.8, nat * 1.05, nat * 0.8);
    hb.castShadow = false;
    hb.userData.target = G.bossT;
    G.bossT.hit = hb;
    const egg = buildEgg();
    egg.scale.setScalar(0.7 / boss.scale);
    egg.position.set(0, -1.4, -0.5);
    boss.armR.add(egg);
    G.egg = egg;
    renderProgress();
    await camTo(V(9, 9, z0 + 27), V(0, 4, z0), 1.2);
    if (my !== token) return;
    sfx.rumble();
    cam.shake = 0.8;
    puff(world.scene, V(0, 0.5, z0), 14, city.water ? "#D8F2FF" : "#C9B79C", 1.6);
    await tween(1.8, (k) => { boss.root.position.y = (-BOSS_H - 1) * (1 - k); }, ease.out);
    boss.root.position.y = 0;
    boss.roarT = 1.1;
    sfx.voice(boss.voice);

    let cx = H.x, cz = H.z, n = 1;

  /* the band between the HUD, the question card (beside the fight on wide screens) and the punch button */
  function gameSafe() {
    const s = safeRect("#gamePass"), card = $("#qcard");

      const r = card.getBoundingClientRect();
      s.left = Math.max(s.left, r.right + 8);
      s.top = Math.min(s.top, $(".hud").getBoundingClientRect().bottom + 6);
    }
    // keep the action clear of the thumb buttons: above them on tall screens, beside them on wide ones

  function frameBoss() {
    const H = G.hero.root.position, B = G.boss.root.position;
    const pts = [V(H.x - 3, 0, H.z + 3), V(H.x + 3, 0, H.z + 3), V(H.x, HERO_H, H.z), V(B.x - 4, 0, B.z - 2), V(B.x + 4, 0, B.z - 2), V(B.x, BOSS_H + 0.8, B.z)];

  function updateGame(dt) {
    if (G.cd > 0) G.cd -= dt;
    if (G.pending > 0) { G.pending -= dt; if (G.pending <= 0) resolveHit(G.pendingTarget); }
    if (G.phase !== "cut") updateHero(dt);
    animateMonster(G.hero, tNow, dt);
    if (G.boss) {
      updateBoss(dt);
      animateMonster(G.boss, tNow + 1.3, dt);
      if (!G.bossDown) {
        const bp = G.boss.root.position;
        for (const b of world.buildings) if (b.alive && b.car && Math.hypot(b.x - bp.x, b.z - bp.z) < 3.4) smashBuilding(b);
      }
    }
    if (G.baby) animateMonster(G.baby, tNow * 1.4, dt);
    const hp = G.hero.root.position;
    for (const b of G.bugs) {
      if (!b.alive) continue;
      animateMonster(b.model, tNow + b.phase, dt);
      b.model.root.position.y = Math.abs(Math.sin(tNow * 3 + b.phase)) * 0.45;
      if (G.phase !== "teach") turnToward(b.holder, hp.x, hp.z, dt, 5);
      b.badge.scale.setScalar(b.hint ? 2.5 * (1 + 0.14 * Math.sin(tNow * 9)) : 2.5);
    }
    for (const g of G.gems) {
      if (!g.alive) continue;
      g.gem.rotation.y += dt * 1.6;
      g.gem.position.y = 1.7 + Math.sin(tNow * 2 + g.index) * 0.25;
      g.badge.scale.setScalar(g.hint ? 2.5 * (1 + 0.14 * Math.sin(tNow * 9)) : 2.5);
    }
    updateWaves(dt);
    if (Q && !busy && (G.phase === "bugs" || G.phase === "boss")) {
      G.idleT += dt;
      if (G.idleT > 18 && G.nudges < 2) {
        G.idleT = 0;
        G.nudges++;
        sayAsk();
        [...G.bugs, ...G.gems].forEach((t) => { if (t.alive && !t.wrong) bounceTarget(t); });
      }
    }
    world.sun.position.set(hp.x - 18, 34, hp.z + 16);
    world.sun.target.position.set(hp.x, 0, hp.z);
    if (world.water) world.water.position.y = 0.06 + Math.sin(tNow * 0.8) * 0.04;
    world.smoke.forEach((s2, i) => { s2.position.y += dt * 1.2; if (s2.position.y > 62) s2.position.y = 38; s2.position.x = -46 + Math.sin(tNow * 0.3 + i) * 2; });
    if (cam.mode === "follow") frameNow();
  }
  function loop() {
    requestAnimationFrame(loop);

    const dt = Math.min(0.05, clock.getDelta());
    if (current === "practice") return;
    tNow += dt;
    if (current === "game" && G && world) {
      let wdt = dt;
      if (G.hitStop > 0) { G.hitStop -= dt; wdt = dt * 0.15; }
      updateTweens(wdt);
      updateParts(wdt);
      updateGame(wdt);
      applyCamera(dt);
      renderer.render(world.scene, camera);
    } else if (home.scene) {
      updateTweens(dt);
      updateParts(dt);
      const m = home.monster;
      if (m) { animateMonster(m, tNow, dt); m.root.rotation.y = Math.PI + Math.sin(tNow * 0.55) * 0.5; }
      applyCamera(dt);
      renderer.render(home.scene, camera);
    }
  }

  function reviewText(it) {

  }
  function renderReview() {

  /* Installing the hosted game as an app. Offered only where the page links an app manifest (the GitHub

  function setLang(lang) {

  /* hold for 2 seconds, so a quick tap from little fingers does not open the grown-up settings */

  /* A short round uses objects, a drawing, and one question to picture
     in the child's head. A full round keeps the five regular questions. */
  const PRACTICE_FACTS = [
    [[2, 7]], [[1, 4]], [[3, 5]],
    [[2, 5], [2, 6], [3, 6], [4, 8]],
    [[3, 8], [4, 9], [6, 10], [7, 10]],
  ];
  const PRACTICE_ROUNDS = {
    add: PRACTICE_FACTS,
    sub: PRACTICE_FACTS,
    compare: [
      [[3, 5]], [[6, 2]], [[4, 4]],
      [[2, 6], [5, 3], [7, 7], [4, 8]],
      [[9, 7], [8, 10], [6, 6], [10, 8]],
    ],
    fill: [
      [[5, 8]], [[2, 7]], [[2, 6]],
      [[2, 5], [3, 6], [4, 8]],
      [[3, 8], [4, 9], [6, 10], [7, 10]],
    ],
  };
  const PRACTICE_DIAGRAMS = ["part", null, "whole", "part", "whole"];
  const SHORT_PRACTICE = [0, 1, 3];
  const GUIDED_QUESTIONS = 3;
  let practiceRound = "short";
  let practice = null;

  function practiceStage(kind) {
    return PRACTICE_GROWTH.reduce((stage, minimum, i) => S.practice[kind] >= minimum ? i : stage, 0);
  }

  function practiceArt(kind, stage = 0, art = el("span", "practice-creature")) {
    art.dataset.species = kind;
    art.dataset.stage = stage;
    return art;
  }

  function renderPracticeLessons() {
    const P = T().practice;
    $$("#practiceMenu [data-lesson]").forEach((b) => {
      const kind = b.dataset.lesson, lesson = P[kind], stage = practiceStage(kind);
      $(".lesson-name", b).textContent = lesson.title;
      $(".lesson-intro", b).textContent = lesson.intro;
      $(".lesson-level", b).textContent = `${lesson.animal} · ${P.stage(fmt(stage + 1))}`;
      practiceArt(kind, stage, $(".practice-creature", b));
    });
  }

  function renderPracticeCompanion(panel, kind, grew) {
    const P = T().practice, stage = practiceStage(kind), animal = P[kind].animal;
    const next = PRACTICE_GROWTH[stage + 1];

    practiceArt(kind, stage, $(".practice-creature", panel));
    $("strong", panel).textContent = grew ? P.grew(animal) : `${animal} · ${level}`;
    $("small", panel).textContent = grew ? level : next ? P.growth(fmt(next - S.practice[kind])) : "";
  }
